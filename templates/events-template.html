<html>
<head><title>Coming Events</title></head>
<body>
  <main>
    <div>
      {{#data}}
        <div class="event">
          <h2>{{name}}</h2>
          <picture>
            <img src="{{image}}" alt="{{name}} in {{location}}">
          </picture>
          <a href="{{url}}">More Info</a>
        </div>
      {{/data}}
    </div>
  </main>
</body>
</html>
